<!DOCTYPE html>
<html>

<head>
    <title>Tech & Coding Courses</title>
</head>

<body style="font-family: Arial; background-color: #eef2f7;">

    <div
        style="width: 400px; margin: 80px auto; padding: 20px; background-color: white; border-radius: 6px; box-shadow: 0 0 8px #ccc;">

        <h2 style="text-align: center; color: #333;">Enroll in Tech & Coding Course</h2>

        <form>

            <label>Full Name:</label><br>
            <input type="text" placeholder="Enter your full name"
                style="width: 100%; padding: 8px; margin: 5px 0 15px 0;"><br>

            <label>Email:</label><br>
            <input type="email" placeholder="Enter your email"
                style="width: 100%; padding: 8px; margin: 5px 0 15px 0;"><br>

            <label>Select Course:</label><br>
            <select style="width: 100%; padding: 8px; margin: 5px 0 15px 0;">
                <option>Web Development</option>
                <option>Python Programming</option>
                <option>Data Structures & Algorithms</option>
                <option>Software Engineering Basics</option>
            </select><br>

            <label>Message:</label><br>
            <textarea placeholder="Any questions?"
                style="width: 100%; padding: 8px; height: 70px; margin: 5px 0 15px 0;"></textarea><br>

            <button type="submit"
                style="width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; cursor: pointer;">
                Enroll Now
            </button>

        </form>

    </div>

</body>

</html>
