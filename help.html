<!DOCTYPE html>
<html>

<head>
    <title>Simple Help Form</title>
</head>

<body style="font-family: Arial; background-color: #f4f4f4;">

    <div
        style="width: 350px; margin: 100px auto; padding: 20px; background-color: white; border-radius: 8px; box-shadow: 0px 0px 10px gray;">

        <h2 style="text-align: center; color: #333;">Help Form</h2>

        <form>

            <label style="font-weight: bold;">Name:</label><br>
            <input type="text" placeholder="Enter your name"
                style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

            <label style="font-weight: bold;">Email:</label><br>
            <input type="email" placeholder="Enter your email"
                style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;"><br>

            <label style="font-weight: bold;">Message:</label><br>
            <textarea placeholder="Describe your problem"
                style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; height: 80px;"></textarea><br>

            <button type="submit"
                style="width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Submit
            </button>

        </form>

    </div>

</body>

</html>
